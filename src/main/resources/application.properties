# Configuracion de la base de datos.
spring.datasource.url=jdbc:mysql://localhost:3306/cc?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

#Comunicacion entre Spring Boot y MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#el "update" valida o actualiza las tablas automaticamente.
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
#spring.jpa.hibernate.ddl-auto=validate

#muestra las consultas SQL de Spring Boot
spring.jpa.show-sql=true

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Fuerza el mapeo del directorio src/main/webapp en el entorno local
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:src/main/webapp/

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR
error.include-stacktrace=always
server.error.include-stacktrace=always

server.port=8085